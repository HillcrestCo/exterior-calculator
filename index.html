<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporte de Mercado — Exterior | The Hillcrest Company</title>
<style>
  :root{
    --green:#1e5c3f; --gold:#c9a227; --ink:#2b2b26; --mut:#8a8577;
    --bg:#f7f5ee; --card:#ffffff; --line:#e8e2d2; --soft:#fbf9f3;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:90px;}
  header{background:var(--green); color:#fff; padding:18px 16px 14px; position:relative;}
  header h1{margin:0; font-size:20px;}
  header p{margin:6px 0 0; font-size:12px; opacity:.92; line-height:1.45;}
  .langwrap{position:absolute; top:14px; right:12px; display:flex; gap:6px;}
  .langbtn{background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.65); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .langbtn.on{background:#fff; color:var(--green); border-color:#fff;}
  .brand{display:inline-block; background:#fff; border-radius:12px; padding:8px 16px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .brand img{display:block; height:46px; width:auto;}
  main{max-width:860px; margin:0 auto; padding:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(30,60,40,.06);}
  .card h2{margin:0 0 10px; font-size:15px; color:var(--green);}
  .note{font-size:11.5px; color:var(--mut); margin:8px 0 0; line-height:1.5;}
  label.f{display:block; font-size:11px; color:var(--mut); margin:0 0 3px;}
  input[type=text],select{width:100%; padding:10px; font-size:15px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold); outline-offset:-1px; border-color:var(--gold);}
  textarea{width:100%; min-height:90px; border:1px solid var(--line); border-radius:10px;
    padding:10px; font-size:14px; font-family:inherit;}
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  button.big{flex:1 1 140px; padding:13px 10px; font-size:15px; border-radius:12px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-weight:600; color:var(--ink);}
  button.big.primary{background:var(--green); color:#fff; border-color:var(--green);}
  button.big.warn{background:#fff; color:#b04a3a; border-color:#e5c4bc;}
  button.big:active{transform:scale(.98);}
  .hidden{display:none!important;}
  /* tabs */
  .tabs{display:flex; gap:8px; margin-bottom:12px;}
  .tabbtn{flex:1; padding:11px 8px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-weight:700; font-size:14px; color:var(--mut); cursor:pointer;}
  .tabbtn.on{background:var(--green); color:#fff; border-color:var(--green);}
  /* address autocomplete */
  .addrwrap{position:relative;}
  #addrSug{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line);
    border-top:none; border-radius:0 0 10px 10px; z-index:40; display:none;
    max-height:230px; overflow:auto; box-shadow:0 8px 20px rgba(0,0,0,.14);}
  #addrSug.show{display:block;}
  .sug{padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); cursor:pointer; line-height:1.35;}
  .sug:last-child{border-bottom:none;}
  .sug:active{background:#eef4ec;}
  /* checklist rows */
  .checkline{display:flex; gap:10px; align-items:flex-start; padding:8px 0;
    border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.4;}
  .checkline:last-child{border-bottom:none;}
  .checkline input{width:20px; height:20px; accent-color:var(--green); flex:none; margin-top:1px;}
  .qgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  @media(max-width:560px){.qgrid{grid-template-columns:1fr;}}
  /* scope rows */
  .srow{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:var(--soft);}
  .srow.on{border-color:var(--green); background:#f0f6ef;}
  .srow-head{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .srow-head input{width:20px; height:20px; accent-color:var(--green); flex:none;}
  .srow-head b{font-size:14px; color:var(--green);}
  .srow .notein{margin-top:8px; display:none;}
  .srow.on .notein{display:block;}
  .srow .notein input{font-size:13px; padding:8px 10px;}
  /* reports */
  .rep{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;}
  .rep-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .rep b{font-size:14px; color:var(--green);}
  .rep .meta{font-size:12px; color:var(--mut); margin-top:4px; line-height:1.45;}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; flex:none;}
  .badge.pend{background:#fdf3e0; color:#9a6b1a;}
  .badge.ready{background:#e7f2e9; color:#1e5c3f;}
  .rep .totals{font-size:12.5px; margin-top:8px; line-height:1.6;}
  .rep .actions{display:flex; gap:8px; margin-top:10px;}
  .btn{flex:1; padding:10px 8px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink);}
  .btn.primary{background:var(--green); color:#fff; border-color:var(--green);}
  .btn.danger{color:#b04a3a; border-color:#e5c4bc; flex:0 1 auto;}
  .rempty{font-size:13px; color:var(--mut); padding:10px 2px; text-align:center;}
  .seclabel{font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase;
    letter-spacing:.06em; margin:14px 0 6px;}
  /* report detail */
  .kv{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0;
    border-bottom:1px solid var(--line);}
  .kv span:first-child{color:var(--mut);}
  .kv span:last-child{text-align:right; font-weight:600;}
  .rtable{width:100%; border-collapse:collapse; font-size:12px; margin-top:8px;}
  .rtable th{background:var(--green); color:#fff; padding:7px 5px; text-align:left; font-size:11px;}
  .rtable th.r,.rtable td.r{text-align:right;}
  .rtable td{padding:6px 5px; border-bottom:1px solid var(--line);}
  .rtable tr.tot td{font-weight:700; border-top:2px solid var(--gold); border-bottom:none; font-size:13px;}
  .bk{margin-bottom:12px; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--soft);}
  .bk h3{margin:0 0 8px; font-size:14px; color:var(--green);}
  .bk .big{font-size:20px; font-weight:800; color:var(--ink); margin-bottom:6px;}
  .bk .rowline{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;
    border-bottom:1px dashed var(--line);}
  .bk .rowline span:last-child{font-weight:700;}
  .bk .rowline.profit span:last-child{color:var(--green);}
  .bk .rowline.warnline{color:#b04a3a; font-weight:700;}
  .bk .rowline.warnline span:last-child{color:#b04a3a;}
  .internal-tag{display:inline-block; font-size:10.5px; font-weight:700; color:#9a6b1a;
    background:#fdf3e0; border-radius:6px; padding:2px 8px; margin-left:6px; vertical-align:middle;}
  /* modal + toast (suite pattern) */
  #gabyModal{position:fixed; inset:0; background:rgba(20,30,22,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:100;}
  #gabyModal.show{display:flex;}
  #gabySheet{background:#fff; border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:560px; max-height:86vh; overflow:auto;}
  #gabySheet h2{margin:0 0 10px; font-size:16px; color:var(--green);}
  #gabySum{font-size:13.5px; line-height:1.55;}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#22301f; color:#fff; font-size:13.5px; padding:11px 18px; border-radius:24px;
    opacity:0; transition:all .25s; z-index:200; max-width:92vw; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #shareCard{display:none;}
  #shareCard.show{display:block;}
  #shareText{width:100%; height:150px; font-size:12px; border:1px solid var(--line); border-radius:10px; padding:10px;}
  .ver-tag{position:fixed; right:8px; bottom:8px; font-size:10px; color:var(--mut);
    background:rgba(255,255,255,.8); padding:2px 8px; border-radius:8px;}
</style>
</head>

/* ================= Estado ================= */
function defaultForm(){
  const areas={};
  AREAS.forEach(a=>{areas[a.id]={on:0,note:""};});
  const lidar={}; LIDAR_ITEMS.forEach(l=>{lidar[l.id]=0;});
  const acc={}; ACCS.forEach(a=>{acc[a.id]=0;});
  return {client:"",address:"",companycam:"",comment:"",
    lidar:lidar, areas:areas,
    damage:"none",damageDetail:"",repairs:"",
    acc:acc, lead:0, hoa:0, timeline:""};
}
function normalize(st){
  const d={lang:"es",form:defaultForm(),pending:[],reports:[]};
  if(!st||typeof st!=="object")return d;
  d.lang=st.lang==="en"?"en":"es";
  const f=st.form||{};
  ["client","address","companycam","comment","damageDetail","repairs","timeline"].forEach(k=>{
    if(typeof f[k]==="string")d.form[k]=f[k];});
  if(DAMAGE_OPTS.some(o=>o.id===f.damage))d.form.damage=f.damage;
  ["lead","hoa"].forEach(k=>{d.form[k]=f[k]?1:0;});
  LIDAR_ITEMS.forEach(l=>{if(f.lidar&&f.lidar[l.id])d.form.lidar[l.id]=1;});
  ACCS.forEach(a=>{if(f.acc&&f.acc[a.id])d.form.acc[a.id]=1;});
  AREAS.forEach(a=>{
    const r=(f.areas&&f.areas[a.id])||{};
    d.form.areas[a.id]={on:r.on?1:0,note:typeof r.note==="string"?r.note:""};
  });
  if(Array.isArray(st.pending))d.pending=st.pending.filter(p=>p&&p.pid);
  if(Array.isArray(st.reports))d.reports=st.reports.filter(r=>r&&r.id&&r.calc==="exterior-report");
  return d;
}
function loadState(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)return normalize(JSON.parse(raw));}catch(e){}
  return normalize(null);
}

let acTimer=null;
$("addrInput").addEventListener("input",e=>{
  state.form.address=e.target.value;save();
  clearTimeout(acTimer);
  const q=e.target.value.trim();
  if(q.length<4){hideSug();return;}
  acTimer=setTimeout(()=>fetchSug(q),450);
});
$("addrInput").addEventListener("blur",()=>setTimeout(hideSug,250));
function hideSug(){$("addrSug").classList.remove("show");$("addrSug").innerHTML="";}
function fetchSug(q){
  fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=6&addressdetails=1&q="+encodeURIComponent(q))
    .then(r=>r.json()).then(arr=>showSug(arr)).catch(()=>hideSug());
}
function showSug(arr){
  if(!arr||!arr.length){hideSug();return;}
  const box=$("addrSug");
  box.innerHTML=arr.map((p,i)=>{
    const label=(p.display_name||"").split(",").slice(0,4).join(",");
    return '<div class="sug" data-sug="'+i+'">'+esc(label)+'</div>';
  }).join('');
  box.classList.add("show");
  box.querySelectorAll(".sug").forEach(el=>{
    el.addEventListener("mousedown",ev=>{
      ev.preventDefault();
      const p=arr[Number(el.getAttribute("data-sug"))];
      const a=p.address||{};
      const bits=[a.house_number,a.road].filter(Boolean).join(" ");
      const city=a.city||a.town||a.village||a.hamlet||"";
      const stt=a.state_code||a.state||"";
      const zip=a.postcode||"";
      const full=[bits,[city,stt].filter(Boolean).join(", "),zip].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
      state.form.address=full||p.display_name;
      $("addrInput").value=state.form.address;save();hideSug();
    });
  });
}

<script>
/* ================= Handoff de campo -> Gaby ================= */
function selectedAreas(){
  return AREAS.filter(a=>state.form.areas[a.id].on).map(a=>{
    const r=state.form.areas[a.id];
    return {id:a.id,name_es:a.es,name_en:a.en,note:(r.note||"").trim()};
  });
}
function buildFieldHandoff(){
  const f=state.form;
  return {
    v:3, calc:"exterior",
    client:(f.client||"").trim(),
    address:(f.address||"").trim(),
    companycam:(f.companycam||"").trim(),
    date:new Date().toISOString().slice(0,10),
    lang:lang,
    lidar:{lidarOn:f.lidar.lidaron?1:0, fourSides:f.lidar.sides?1:0, closeUps:f.lidar.close?1:0},
    areas:selectedAreas().map(a=>({id:a.id,name_es:a.name_es,name_en:a.name_en,selected:1,note:a.note})),
    questions:{
      damage:f.damage, damageDetail:(f.damageDetail||"").trim(),
      repairs:(f.repairs||"").trim(),
      access:ACCS.filter(a=>f.acc[a.id]).map(a=>a.id),
      leadPaint:f.lead?1:0, hoaApproval:f.hoa?1:0,
      timeline:(f.timeline||"").trim()
    },
    comment:(f.comment||"").trim()
  };
}
function fieldSubject(d){return "[Exterior-Gaby] "+(d.client||"")+(d.address?" — "+d.address:"");}
function fieldBody(d){
  const es=lang==="es",L=[];
  L.push((es?"Cliente":"Client")+": "+(d.client||"—"));
  if(d.address)L.push((es?"Dirección":"Address")+": "+d.address);
  if(d.companycam)L.push("CompanyCam: "+d.companycam);
  L.push((es?"Fecha":"Date")+": "+d.date);
  L.push("");
  const ln=d.lidar;
  L.push("LiDAR: "+[ln.lidarOn?"ON":"off",ln.fourSides?"4 sides":"",ln.closeUps?"close-ups":""].filter(Boolean).join(" · "));
  L.push("");
  L.push(t("scopeSec"));
  d.areas.forEach(a=>{
    const nm=es?a.name_es:a.name_en;
    L.push("• "+nm+(a.note?" ("+a.note+")":""));
  });
  const q=d.questions;
  L.push("");
  L.push(t("qSec"));
  L.push("damage: "+q.damage+(q.damageDetail?" — "+q.damageDetail:""));
  if(q.repairs)L.push("repairs: "+q.repairs);
  if(q.access.length)L.push("access: "+q.access.join(", "));
  if(q.leadPaint)L.push("lead paint risk");
  if(q.hoaApproval)L.push("HOA approval");
  if(q.timeline)L.push("timeline: "+q.timeline);
  if(d.comment){L.push("");L.push((es?"Notas":"Notes")+": "+d.comment);}
  L.push("");
  L.push("---BEGIN-EXTERIOR-DATA---");
  L.push(JSON.stringify(d));
  L.push("---END-EXTERIOR-DATA---");
  return L.join("\n");
}
let modalMode="field", modalRepId=null;
function openFieldModal(){
  if(!(state.form.client||"").trim()){toast(t("gabyNeedClient"));$("clientInput").focus();return;}
  if(!selectedAreas().length){toast(t("gabyNeedArea"));return;}
  const d=buildFieldHandoff();
  const es=lang==="es";
  let h="<b>"+esc(d.client||"—")+"</b>";
  if(d.address)h+=" · "+esc(d.address);
  if(d.companycam)h+="<br>CompanyCam: "+esc(d.companycam);
  h+="<br>"+d.areas.length+" "+esc(t("areasWord"))+": "+esc(d.areas.map(a=>es?a.name_es:a.name_en).join(" · "));
  if(d.comment)h+="<br><br>"+esc(d.comment);

    areas:d.areas.map(a=>lang==="es"?a.name_es:a.name_en),comment:d.comment});

  const href="mailto:"+GABY_MAIL+"?subject="+encodeURIComponent(fieldSubject(d))+"&body="+encodeURIComponent(fieldBody(d));
  toast(t("gabyMailOpen"));
  const a=document.createElement("a");a.href=href;a.style.display="none";

function copyText(txt,done){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){toast(t("copyManual"));}
  ta.remove();
}

/* ================= Importar reporte (link #r= de Gaby) ================= */
function storeImportedReport(rep){
  if(!rep||rep.calc!=="exterior-report"||!rep.id||!Array.isArray(rep.areas))throw 0;
  const ix=state.reports.findIndex(r=>r.id===rep.id);
  if(ix>=0)state.reports[ix]=rep;else state.reports.unshift(rep);
  state.pending=state.pending.filter(p=>!(p.client===rep.client&&p.address===rep.address));
  save();
}
function importFromHash(){
  const h=location.hash||"";
  const m=h.match(/^#r=([A-Za-z0-9\-_]+=*)$/);
  if(!m)return false;
  try{
    const b64=m[1].replace(/-/g,"+").replace(/_/g,"/");
    storeImportedReport(JSON.parse(decodeURIComponent(escape(atob(b64)))));
    toast(t("imported"));
  }catch(e){toast(t("importFail"));}
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e2){}
  return true;
}
/* Link corto ?report=<id>: Gaby publica reports/<id>.json en el sitio y la app lo descarga solo */
function importFromReportParam(){
  let id="";
  try{id=new URLSearchParams(location.search).get("report")||"";}catch(e){}
  if(!/^[A-Za-z0-9][A-Za-z0-9\-_]{2,60}$/.test(id))return;
  fetch("reports/"+id+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(rep=>{storeImportedReport(rep);toast(t("imported"));showView("reports");
      try{history.replaceState(null,"",location.pathname);}catch(e2){}})
    .catch(e=>{toast(t("importFail"));});
}

function bkCard(label,opt){
  const o=opt||{};
  const paintLine=(o.paintGal!=null)?money(o.paint)+" ("+o.paintGal+" "+t("bkGal")+")":money(o.paint);
  return '<div class="bk"><h3>'+esc(label)+'</h3><div class="big">'+money(o.total)+'</div>'

   +'<div class="rowline"><span>'+esc(t("bkBase"))+'</span><span>'+money(o.base)+'</span></div>'
   +'<div class="rowline"><span>'+esc(t("bkLabor"))+'</span><span>'+money(o.labor)+'</span></div>'
   +'<div class="rowline"><span>'+esc(t("bkPaint"))+(o.paintPct!=null?" ("+pct1(o.paintPct)+")":"")+'</span><span>'+esc(paintLine)+'</span></div>'
   +'<div class="rowline profit"><span>'+esc(t("bkProfit"))+(o.profitPct!=null?" ("+pct1(o.profitPct)+")":"")+'</span><span>'+money(o.profit)+'</span></div>'
   +'</div>';
}
function guardFor(o){
  var rows=[];
  [15,10,5,-5,-10,-15].forEach(function(p){
    var price=Math.round(o.total*(1+p/100)*100)/100;
    var profit=0.9*price-(+o.labor||0)-(+o.paint||0);
    var mg=profit/price;
    if(mg>=0.15-1e-9)rows.push({p:p,price:price,mg:Math.round(mg*1000)/10,dAmt:Math.round((price-o.total)*100)/100});
  });
  return {rows:rows,noDisc:!rows.some(function(r){return r.p<0;})};
}
function guardCard(label,o){
  var g=guardFor(o),h='<div class="bk"><h3>'+esc(label)+' &middot; '+esc(t("guardL"))+'<span class="internal-tag">'+esc(t("internalTag"))+'</span></h3>';
  g.rows.forEach(function(r){
    var da=(r.dAmt<0?"-$":"+$")+Math.abs(Math.round(r.dAmt)).toLocaleString("en-US");
    h+='<div class="rowline"><span>'+(r.p>0?"+":"")+r.p+'% ('+da+') &rarr; '+money(r.price)+'</span><span>'+pct1(r.mg)+' '+esc(t("marginL"))+'</span></div>';
  });
  if(g.noDisc)h+='<div class="rowline warnline"><span>'+esc(t("guardNoDisc"))+'</span><span></span></div>';
  return h+'</div>';
}

/* ================= Enviar reporte a Gaby ================= */
function reportSubject(r){return "[Exterior-Gaby] REPORTE: "+(r.client||"")+(r.address?" — "+r.address:"");}
function reportBody(r,instructions){
  const es=lang==="es",L=[];
  L.push((es?"Cliente":"Client")+": "+(r.client||"—"));
  if(r.address)L.push((es?"Dirección":"Address")+": "+r.address);
  const tot=r.totals||{};
  L.push(t("colTu")+": "+money(tot.tu)+" · "+t("colMn")+": "+money(tot.mn)+" · "+t("colRec")+": "+money(tot.rec));
  if(instructions&&instructions.trim()){L.push("");L.push(t("instrL")+": "+instructions.trim());}
  L.push("");
  L.push("---BEGIN-EXTERIOR-DATA---");
  const payload=Object.assign({},r,{gabyInstructions:(instructions||"").trim()});
  L.push(JSON.stringify(payload));
  L.push("---END-EXTERIOR-DATA---");
  return L.join("\n");
}
function openReportModal(r){
  const tot=r.totals||{};
  $("gabySum").innerHTML="<b>"+esc(r.client||"—")+"</b>"+(r.address?" · "+esc(r.address):"")
    +"<br>"+esc(t("colTu"))+": <b>"+money(tot.tu)+"</b> · "+esc(t("colMn"))+": <b>"+money(tot.mn)+"</b> · "+esc(t("colRec"))+": <b>"+money(tot.rec)+"</b>";
  $("gabyInstr").value="";
  $("gabyInstrWrap").classList.remove("hidden");
  modalMode="report";modalRepId=r.id;
  $("gabyModal").classList.add("show");
}
function sendReportMail(id){
  const r=getReport(id);
  if(!r)return;
  const instr=$("gabyInstr").value||"";
  const href="mailto:"+GABY_MAIL+"?subject="+encodeURIComponent(reportSubject(r))+"&body="+encodeURIComponent(reportBody(r,instr));
  toast(t("gabyMailOpen"));
  const a=document.createElement("a");a.href=href;a.style.display="none";
  document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
  setTimeout(()=>$("gabyModal").classList.remove("show"),800);
}

/* ================= PDF del reporte (apto para cliente: sin desglose) ================= */
function wrap(txt,n){
  const w=String(txt).split(/\s+/),L=[],c=[];let len=0;
  w.forEach(x=>{if(len+x.length+1>n&&c.length){L.push(c.join(" "));c.length=0;len=0;}c.push(x);len+=x.length+1;});
  if(c.length)L.push(c.join(" "));
  return L.length?L:[""];
}
function buildReportPdf(r){
  const P={s:""};
  const GREEN="0.118 0.361 0.247",GOLD="0.788 0.635 0.153",DARK="0.17 0.17 0.15",GRAY="0.54 0.52 0.47";
  function T(x,y,txt,size,bold,color){P.s+="BT /F"+(bold?"2":"1")+" "+size+" Tf "+color+" rg "+x.toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET\n";}
  function rect(x,y,w,h,color){P.s+=color+" rg "+x+" "+y+" "+w+" "+h+" re f\n";}
  const te=k=>(STRINGS.en[k]!==undefined?STRINGS.en[k]:STRINGS.es[k]);
  if(LOGO_BIN)P.s+="q 190 0 0 41.1 36 560 cm /Im1 Do Q\n";
  T(36,542,te("pdfTitle"),12,true,DARK);
  let y=526;
  if(r.client){T(36,y,r.client,11,true,DARK);y-=16;}
  if(r.address){T(36,y,te("projLabel")+r.address,9,false,DARK);y-=14;}
  let yb="";
  if(r.yearBuilt!=null&&r.yearBuilt!=="")yb+=te("yearBuiltL")+": "+r.yearBuilt;
  if(r.marketValue!=null&&r.marketValue!==""){if(yb)yb+="   ·   ";yb+=te("marketValL")+": "+(typeof r.marketValue==="number"?money(r.marketValue):r.marketValue);}
  if(yb){T(36,y,yb,9,false,DARK);y-=14;}
  if(r.companycam){T(36,y,"CompanyCam: "+String(r.companycam).slice(0,80),8,false,GRAY);y-=13;}
  T(36,y,te("dateLabel")+": "+(r.date||""),9,false,GRAY);y-=10;
  rect(36,y,720,2.5,GOLD);y-=24;
  const cx=[36,58,300,425,522,619],hw=["#",te("colArea"),te("colQty"),te("colTu"),te("colMn"),te("colRec")];
  rect(36,y-6,720,20,GREEN);
  hw.forEach((hh,i)=>T(cx[i]+4,y,hh,9,true,"1 1 1"));
  y-=20;
  (r.areas||[]).forEach((a,i)=>{
    if(y<90)return;
    const nm=a.name_en||a.name_es||"";
    if(i%2===0)rect(36,y-6,720,20,"0.96 0.97 0.94");
    T(cx[0]+4,y,String(i+1)+".",9,false,DARK);
    T(cx[1]+4,y,nm.length>36?nm.slice(0,36)+"…":nm,9,false,DARK);
    const q=String(a.qty||"—");
    T(cx[2]+4,y,q.length>18?q.slice(0,18)+"…":q,9,false,DARK);
    T(cx[3]+4,y,money(a.tu),9,false,DARK);
    T(cx[4]+4,y,money(a.mn),9,false,DARK);
    T(cx[5]+4,y,money(a.rec),9,false,DARK);
    y-=20;
  });
  const tot=r.totals||{};
  y-=2;rect(36,y-6,720,2,GOLD);y-=20;
  T(cx[1]+4,y,te("totalL"),10,true,DARK);
  T(cx[3]+4,y,money(tot.tu),10,true,DARK);
  T(cx[4]+4,y,money(tot.mn),10,true,DARK);
  T(cx[5]+4,y,money(tot.rec),10,true,DARK);
  y-=22;
  const bk=r.breakdown||{},bcols=["tu","mn","rec"],bkeys=["colTu","colMn","colRec"];
  if(bk.tu&&bk.mn&&bk.rec&&y>195){
    T(cx[1]+4,y,"Internal breakdown \u2014 do not share with client",9,true,GRAY);y-=16;
    bkeys.forEach((k,i)=>T(cx[3+i]+4,y,te(k),9,true,DARK));
    y-=14;
    const brows=[
      ["Overhead (10%)",b=>b.overhead],
      ["Base (90%)",b=>b.base],
      ["Labor (60% of base)",b=>b.labor],
      ["Paint ("+(bk.tu.paintGal||"?")+" gal)",b=>b.paint],
      ["Profit",b=>b.profit]
    ];
    brows.forEach((rw,i)=>{
      if(i%2===1)rect(36,y-5,720,17,"0.96 0.97 0.94");
      T(cx[1]+4,y,rw[0],8.5,false,DARK);
      bcols.forEach((c,j)=>T(cx[3+j]+4,y,money(rw[1](bk[c])),8.5,false,DARK));
      y-=17;
    });
    y-=8;
  }
  if(r.notes){
    T(36,y,te("notesL"),9,true,GRAY);y-=14;
    wrap(r.notes,92).slice(0,5).forEach(ln=>{T(36,y,ln,8.5,false,DARK);y-=12;});
    y-=6;
  }
  T(36,40,"The Hillcrest Company · 612-741-9863",8.5,true,GREEN);
  var hasBk=!!(r.breakdown&&(r.breakdown.tu||r.breakdown.mn||r.breakdown.rec));
  var P2={s:""};
  function T2(x,y,txt,size,bold,color){P2.s+="BT /F"+(bold?"2":"1")+" "+size+" Tf "+color+" rg "+x.toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET\n";}
  var RED="0.72 0.10 0.10";
  var y2=560;
  T2(36,y2,"Margin guardrail \u2014 internal, do not share with client",12,true,DARK);y2-=24;
  [["tu","Your price"],["mn","Minnesota"],["rec","Recommended"]].forEach(function(gc){
    var o=(r.breakdown||{})[gc[0]];
    if(!o||y2<120)return;
    var g=guardFor(o);
    var baseMg=Math.round(((0.9*o.total-(+o.labor||0)-(+o.paint||0))/o.total)*1000)/10;
    T2(36,y2,gc[1]+" \u2014 base "+money(o.total)+" (margin "+baseMg+"%)",10,true,DARK);y2-=16;
    g.rows.forEach(function(rr){
      if(y2<70)return;
      var da2=(rr.dAmt<0?"-$":"+$")+Math.abs(Math.round(rr.dAmt)).toLocaleString("en-US");
      T2(58,y2,(rr.p>0?"+":"")+rr.p+"% ("+da2+")  ->  "+money(rr.price)+"   (margin "+rr.mg+"%)",9,false,DARK);y2-=14;
    });
    if(g.noDisc&&y2>70){T2(58,y2,"NO MARGIN FOR DISCOUNTS \u2014 any discount drops profit below 15%.",9,true,RED);y2-=16;}
    y2-=10;
  });
  T2(36,40,"The Hillcrest Company \u00b7 612-741-9863",8.5,true,GREEN);
  const objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]="<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
  const res="<< /Font << /F1 4 0 R /F2 5 0 R >>"+(LOGO_BIN?" /XObject << /Im1 7 0 R >>":"")+" >>";
  objs[3]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources "+res+" /Contents 6 0 R >>";
  objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objs[6]="<< /Length "+P.s.length+" >>\nstream\n"+P.s+"endstream";
  let count=6;
  if(LOGO_BIN){count=7;objs[7]="<< /Type /XObject /Subtype /Image /Width "+LOGO_W+" /Height "+LOGO_H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+LOGO_BIN.length+" >>\nstream\n"+LOGO_BIN+"endstream";}
  if(hasBk){
    var p2n=count+1,c2n=count+2;
    objs[p2n]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents "+c2n+" 0 R >>";
    objs[c2n]="<< /Length "+P2.s.length+" >>\nstream\n"+P2.s+"endstream";
    objs[2]="<< /Type /Pages /Kids [3 0 R "+p2n+" 0 R] /Count 2 >>";
    count=c2n;
  }
  let pdf="%PDF-1.4\n",offs=[0];
  for(let i=1;i<=count;i++){offs[i]=pdf.length;pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  const xoff=pdf.length;
  pdf+="xref\n0 "+(count+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=count;i++)pdf+="0000000000".slice(0,10-String(offs[i]).length)+offs[i]+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(count+1)+" /Root 1 0 R >>\nstartxref\n"+xoff+"\n%%EOF";
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  return bytes;
}
async function shareReportPdf(r){
  const card=$("shareCard"),msg=$("copyMsg");
  card.classList.add("show");
  msg.textContent=t("pdfGen");
  try{
    const bytes=buildReportPdf(r);
    const blob=new Blob([bytes.buffer],{type:"application/pdf"});
    let file;
    try{file=new File([blob],("Reporte-Exterior-"+(r.client||"casa")).replace(/[^a-zA-Z0-9-_]+/g,"-")+".pdf",{type:"application/pdf"});}
    catch(fe){file=blob;}
    let shared=false;
    if(navigator.canShare){
      try{
        if(navigator.canShare({files:[file]})){
          try{await navigator.share({files:[file],title:"Reporte Exterior Hillcrest"});msg.textContent=t("pdfShared");return;}
          catch(se){if(se&&se.name==="AbortError")return;}
        }
      }catch(ce){shared=false;}
    }
    if(!shared){
      const url=URL.createObjectURL(blob);
      let w=null;
      try{w=window.open(url,"_blank");}catch(oe){w=null;}
      if(w)msg.textContent=t("pdfOpened");
      else msg.innerHTML=t("pdfBlocked")+'<a href="'+url+'" target="_blank" rel="noopener">'+t("openPdf")+"</a>";
      setTimeout(function(){URL.revokeObjectURL(url);},120000);
    }
  }catch(err){msg.textContent=t("pdfFail")+(err&&err.message?err.message:String(err));}
}
